<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Shortlist</title>
<meta name="description" content="Narrow your Career Compass matches down to a short, ranked list with a first step for each.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="shortlist.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%236d4a63'/%3E%3Cpath d='M16 6l4 10-4 10-4-10z' fill='%23f6c56d'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M20 7l5 13-5 13-5-13z" fill="var(--accent)"/><circle cx="20" cy="20" r="2.4" fill="var(--paper)"/></svg>
      <span>Career Shortlist</span>
    </div>
    <h2 class="side-title" id="sideTitle">Narrow it down</h2>
    <p class="side-sub" id="sideSub">Quick calls, one job at a time. Everything saves in this browser.</p>
    <ol class="steps" id="stepList"></ol>
    <div class="side-foot">
      <a class="link-btn" href="index.html">Back to Career Compass</a>
      <button class="link-btn" id="resetBtn" type="button">Start over</button>
    </div>
  </aside>
  <main class="main" id="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Show steps">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <div class="step-count" id="stepCount"></div>
    </div>
    <section class="stage" id="stage" tabindex="-1"></section>
    <nav class="pager" id="pager">
      <button class="btn ghost" id="backBtn" type="button">Back</button>
      <button class="btn primary" id="nextBtn" type="button">Next <span aria-hidden="true">&rarr;</span></button>
    </nav>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="csvFile" accept=".csv,text/csv" class="hide">
<script src="data/jobs.js"></script>
<script src="data/training.js"></script>
<script src="data/catalog.js"></script>
<script src="shortlist.js"></script>
</body>
</html>
